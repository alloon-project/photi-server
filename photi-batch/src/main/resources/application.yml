spring:
  profiles:
    active: local, batch
    include:
      - domain
      - infra
  batch:
    job:
      name: ${job.name:NONE}
    enabled: false
    chunk-size: 1000
---
spring:
  config:
    activate:
      on-profile: local
---
spring:
  config:
    activate:
      on-profile: dev
---
spring:
  config:
    activate:
      on-profile: prod

spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: ${SPRING_REDIS_HOST}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_BUCKET}
    stack:
      auto: false

oauth:
  kakao:
    base-url: ${KAKAO_BASE_URL}
    native-app-key: ${KAKAO_NATIVE_APP_KEY}
  google:
    base-url: ${GOOGLE_BASE_URL}
    aos-client-id: ${GOOGLE_AOS_NATIVE_APP_KEY}
    ios-client-id: ${GOOGLE_IOS_NATIVE_APP_KEY}
  apple:
    base-url: ${APPLE_BASE_URL}
    aos-client-id: ${APPLE_AOS_NATIVE_APP_KEY}
    ios-client-id: ${APPLE_IOS_NATIVE_APP_KEY}
---

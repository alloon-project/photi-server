services:
  backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: enduser-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
      - LOGGING_FILE_PATH=/logs
    volumes:
      - /home/ubuntu/logs:/logs
    restart: always
    networks:
      - server-network
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - /var/lib/docker/volumes/redis/data:/data
    restart: always
    networks:
      - server-network
  batch:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: photi-batch-0.0.1-SNAPSHOT.jar
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - redis
    networks:
      - server-network

networks:
  server-network:
    external: true
    driver: bridge
spring:
  config:
    activate:
      on-profile: test
    import:  optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
        show_sql: false
        format_sql: true
        use_sql_comments: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            require: true

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 50MB

logging:
  file:
    name: alloon-rolling.log

sentry:
  traces-sample-rate: 1.0
  logging:
    minimum-event-level: info
    minimum-breadcrumb-level: info

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:}
    s3:
      bucket: ${AWS_BUCKET:}

api:
  name: "Alloon Test"
  master:
    id: alloon
  jwt:
    secret: ${JWT_SECRET:ThisIsSecret}
    domain: ${JWT_DOMAIN:TEST}
    time:
      access: ${JWT_ACCESS:6000}
      refresh: ${JWT_REFRESH:36000}
  mail:
    address: ${MAIL_ADDRESS:}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photi 챌린지</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    button {
      padding: 16px 32px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #007AFF;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0051D5;
    }

    p {
      color: #666;
      margin-top: 16px;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<img src="/logo.jpg" alt="Photi" class="logo">
<button id="openBtn">앱으로 열기</button>
<p id="status">앱을 설치했다면 버튼을 눌러주세요</p>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const challengeId = urlParams.get('challenge_id');

  document.getElementById('openBtn').addEventListener('click', function () {
    const statusEl = document.getElementById('status');
    if (!challengeId) {
      statusEl.textContent = '잘못된 링크입니다.';
      return;
    }
    window.location.href = `photi://challenge/${challengeId}`;
    statusEl.textContent = '앱을 로드 중...';

    setTimeout(() => {
      const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
      if (isIOS) {
        window.location.href = 'https://apps.apple.com/app/photi/6747941953';
      } else {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.photi.aos&pcampaignid=web_share';
      }
    }, 2500);
  });
</script>
</body>
</html>

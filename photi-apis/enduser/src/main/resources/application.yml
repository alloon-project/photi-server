spring:
  profiles:
    active: local
    include:
      - domain
      - infra
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-exp: ${JWT_ACCESS}
      refresh-exp: ${JWT_REFRESH}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
---
spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]
---
spring:
  config:
    activate:
      on-profile: dev
---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  swagger-ui:
    enabled: false
